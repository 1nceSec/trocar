<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VulnHunter — AI漏洞挖掘系统</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --fg: #c9d1d9; --fg2: #8b949e; --border: #30363d;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149;
  --orange: #d29922; --purple: #bc8cff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Cascadia Code','Consolas',monospace; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:18px; color:var(--accent); }
header .right { display:flex; gap:12px; align-items:center; }
header .stats { font-size:13px; color:var(--fg2); }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-p0 { background:#f8514933; color:var(--red); }
.badge-p1 { background:#d2992233; color:var(--orange); }
.badge-p2 { background:#58a6ff33; color:var(--accent); }
.badge-running { background:#3fb95033; color:var(--green); }
.badge-stopped { background:#f8514933; color:var(--red); }
.badge-queued { background:#d2992233; color:var(--orange); }
.badge-vuln_found { background:#3fb95033; color:var(--green); }
.badge-low_roi { background:var(--bg3); color:var(--fg2); }
.badge-need_input { background:#bc8cff33; color:var(--purple); }
.badge-error { background:#f8514933; color:var(--red); }
main { flex:1; display:flex; overflow:hidden; }
.sidebar { width:320px; min-width:280px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; }
.sidebar-header { padding:12px 16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:14px; margin-bottom:8px; }
.btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit; transition:all .15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#79c0ff; }
.btn-danger { background:var(--red); color:#fff; }
.btn-danger:hover { background:#ff7b72; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:var(--fg2); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-block { width:100%; }
.session-list { flex:1; overflow-y:auto; }
.session-item { padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; position:relative; }
.session-item:hover { background:var(--bg3); }
.session-item.active { background:var(--bg3); border-left:3px solid var(--accent); }
.session-item .target { font-size:13px; font-weight:600; word-break:break-all; padding-right:24px; }
.session-item .meta { font-size:11px; color:var(--fg2); margin-top:4px; display:flex; justify-content:space-between; align-items:center; }
.session-item .del-btn { position:absolute; top:8px; right:8px; background:none; border:none; color:var(--fg2); cursor:pointer; font-size:14px; opacity:0; transition:opacity .15s; }
.session-item:hover .del-btn { opacity:1; }
.session-item .del-btn:hover { color:var(--red); }
.content { flex:1; display:flex; flex-direction:column; }
.content-header { padding:12px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; min-height:52px; }
.content-header .phase-bar { display:flex; gap:4px; }
.phase-step { padding:4px 12px; border-radius:4px; font-size:11px; background:var(--bg3); color:var(--fg2); }
.phase-step.active { background:var(--accent); color:#fff; }
.phase-step.done { background:#3fb95044; color:var(--green); }
.panels { flex:1; display:flex; overflow:hidden; }
.log-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.log-output { flex:1; overflow-y:auto; padding:16px 24px; font-size:13px; line-height:1.7; white-space:pre-wrap; word-wrap:break-word; }
.log-output .msg { margin-bottom:8px; }
.log-output .msg.assistant { color:var(--fg); }
.log-output .msg.user { color:var(--accent); }
.log-output .msg.system { color:var(--orange); font-style:italic; }
.input-bar { padding:12px 24px; border-top:1px solid var(--border); display:flex; gap:8px; }
.input-bar input { flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--fg); font-family:inherit; font-size:13px; outline:none; }
.input-bar input:focus { border-color:var(--accent); }
.quick-btns { display:flex; gap:4px; }
.quick-btns button { padding:4px 8px; font-size:11px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--fg2); cursor:pointer; font-family:inherit; }
.quick-btns button:hover { border-color:var(--accent); color:var(--accent); }
.findings-panel { width:340px; border-left:1px solid var(--border); overflow-y:auto; display:none; }
.findings-panel.show { display:block; }
.findings-panel h3 { padding:12px 16px; font-size:13px; border-bottom:1px solid var(--border); }
.finding-card { padding:12px 16px; border-bottom:1px solid var(--border); }
.finding-card .title { font-size:13px; font-weight:600; }
.finding-card .detail { font-size:11px; color:var(--fg2); margin-top:4px; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:24px; width:520px; max-width:90vw; max-height:90vh; overflow-y:auto; }
.modal h2 { font-size:16px; margin-bottom:16px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:12px; color:var(--fg2); margin-bottom:4px; }
.form-group input, .form-group textarea, .form-group select {
  width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:6px;
  padding:8px 12px; color:var(--fg); font-family:inherit; font-size:13px; outline:none;
}
.form-group textarea { resize:vertical; min-height:60px; }
.form-group select { appearance:none; cursor:pointer; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color:var(--accent); }
.form-group .hint { font-size:11px; color:var(--fg2); margin-top:2px; }
.form-row { display:flex; gap:12px; }
.form-row .form-group { flex:1; }
.form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.empty { text-align:center; color:var(--fg2); padding:60px 24px; }
.empty h3 { font-size:16px; margin-bottom:8px; }
.header-btns { display:flex; gap:8px; align-items:center; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:3px; }
</style>
</head>
<body>

<header>
  <h1>VulnHunter</h1>
  <div class="right">
    <span class="stats" id="globalStats"></span>
    <button class="btn btn-ghost btn-sm" onclick="showSkillModal()">Skill</button>
    <button class="btn btn-ghost btn-sm" onclick="showSettingsModal()">Settings</button>
  </div>
</header>

<main>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>测试会话</h2>
      <button class="btn btn-primary btn-block" onclick="showNewModal()">+ 新建测试</button>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty"><h3>暂无会话</h3><p>点击上方按钮开始</p></div>
    </div>
  </div>

  <div class="content">
    <div class="content-header" id="contentHeader" style="display:none">
      <div class="phase-bar" id="phaseBar">
        <span class="phase-step" data-phase="threat_model">1.威胁建模</span>
        <span class="phase-step" data-phase="strike">2.精准打击</span>
        <span class="phase-step" data-phase="reflect">3.深挖反思</span>
        <span class="phase-step" data-phase="bypass">4.Bypass</span>
        <span class="phase-step" data-phase="deep_verify">5.深度验证</span>
      </div>
      <div class="header-btns">
        <span id="sessionStatus"></span>
        <button class="btn btn-ghost btn-sm" onclick="toggleFindings()">漏洞面板</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleBlackboard()">黑板</button>
        <button class="btn btn-danger btn-sm" id="stopBtn" onclick="stopCurrent()">停止</button>
      </div>
    </div>
    <div class="panels">
      <div class="log-panel">
        <div class="log-output" id="logOutput">
          <div class="empty"><h3>选择或创建测试会话</h3><p>左侧选择已有会话，或新建测试开始</p></div>
        </div>
        <div class="input-bar" id="inputBar" style="display:none">
          <input type="text" id="userInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
          <div class="quick-btns">
            <button onclick="quickSend('深入')">深入</button>
            <button onclick="quickSend('换方向')">换方向</button>
            <button onclick="quickSend('写报告')">报告</button>
          </div>
          <button class="btn btn-primary btn-sm" onclick="sendMsg()">发送</button>
        </div>
      </div>
      <div class="findings-panel" id="findingsPanel">
        <h3>发现的漏洞 (<span id="findingsCount">0</span>)</h3>
        <div id="findingsList"></div>
      </div>
      <div class="findings-panel" id="blackboardPanel">
        <h3>黑板状态</h3>
        <div id="bbSummary" style="padding:12px 16px;font-size:12px;"></div>
        <div id="bbDetails" style="padding:0 16px;font-size:12px;"></div>
      </div>
    </div>
  </div>
</main>

<!-- New Session Modal -->
<div class="modal-overlay" id="newModal">
  <div class="modal">
    <h2>新建渗透测试</h2>
    <div class="form-group">
      <label>目标 URL *</label>
      <input type="text" id="inputTarget" placeholder="https://example.com">
    </div>
    <div class="form-group">
      <label>Cookie (账号A)</label>
      <textarea id="inputCookie" placeholder="登录后的Cookie"></textarea>
    </div>
    <div class="form-group">
      <label>Cookie (账号B，用于IDOR对比)</label>
      <textarea id="inputCookieB" placeholder="第二个账号的Cookie（可选）"></textarea>
    </div>
    <div class="form-group">
      <label>备注</label>
      <input type="text" id="inputNotes" placeholder="业务类型、禁测路径等">
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="hideNewModal()">取消</button>
      <button class="btn btn-primary" onclick="createSession()">开始测试</button>
    </div>
  </div>
</div>

<!-- Skill Editor Modal -->
<div class="modal-overlay" id="skillModal">
  <div class="modal" style="width:720px;height:80vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2>Skill 编辑器</h2>
      <span id="skillPath" style="font-size:11px;color:var(--fg2)"></span>
    </div>
    <textarea id="skillEditor" style="flex:1;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--fg);font-family:inherit;font-size:12px;line-height:1.6;resize:none;outline:none;tab-size:2"></textarea>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="hideSkillModal()">取消</button>
      <button class="btn btn-primary" onclick="saveSkill()">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>模型与系统设置</h2>
    <div class="form-group">
      <label>LLM Provider</label>
      <select id="setProvider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI / 兼容API</option>
      </select>
      <div class="hint">选择 OpenAI 兼容模式可接入 DeepSeek、Qwen、GLM 等本地或第三方模型</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Model</label>
        <input type="text" id="setModel" placeholder="claude-sonnet-4-20250514">
      </div>
      <div class="form-group">
        <label>Max Tokens</label>
        <input type="number" id="setMaxTokens" placeholder="16384">
      </div>
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="setApiKey" placeholder="sk-ant-xxxxx 或 sk-xxxxx">
      <div class="hint" id="setApiKeyHint"></div>
    </div>
    <div class="form-group">
      <label>Base URL（可选，留空用默认）</label>
      <input type="text" id="setBaseUrl" placeholder="https://api.example.com/v1">
      <div class="hint">Anthropic 默认留空；OpenAI 兼容模式填第三方 API 地址</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Burp 代理</label>
        <input type="text" id="setBurpProxy" placeholder="http://127.0.0.1:8080">
      </div>
      <div class="form-group">
        <label>最大并发</label>
        <input type="number" id="setMaxConcurrent" placeholder="3" min="1" max="10">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="hideSettingsModal()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
const API = '';
let currentSid = null;
let ws = null;
const PHASES = ['threat_model','strike','reflect','bypass','deep_verify'];

async function fetchSessions() {
  const res = await fetch(API+'/api/sessions');
  const list = await res.json();
  const el = document.getElementById('sessionList');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><h3>暂无会话</h3><p>点击上方按钮开始</p></div>';
    updateGlobalStats([]);
    return;
  }
  el.innerHTML = list.map(s => `
    <div class="session-item ${s.id===currentSid?'active':''}" onclick="selectSession(${s.id})">
      <button class="del-btn" onclick="event.stopPropagation();deleteSession(${s.id})" title="删除">&times;</button>
      <div class="target">${esc(s.target)}</div>
      <div class="meta">
        <span class="badge badge-${s.status}">${statusText(s.status)}</span>
        <span>${s.findings_count} 漏洞 · ${s.turns} 轮</span>
      </div>
    </div>
  `).join('');
  updateGlobalStats(list);
}

function updateGlobalStats(list) {
  const running = list.filter(s=>s.status==='running').length;
  const vulns = list.reduce((a,s)=>a+s.findings_count,0);
  document.getElementById('globalStats').textContent = `运行: ${running} | 漏洞: ${vulns} | 总会话: ${list.length}`;
}

function statusText(s) {
  return {queued:'排队中',running:'运行中',vuln_found:'发现漏洞',low_roi:'无高价值发现',
          need_input:'等待输入',error:'错误',stopped:'已停止'}[s]||s;
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showNewModal() { document.getElementById('newModal').classList.add('show'); document.getElementById('inputTarget').focus(); }
function hideNewModal() { document.getElementById('newModal').classList.remove('show'); }

async function createSession() {
  const target = document.getElementById('inputTarget').value.trim();
  if (!target) return alert('请输入目标URL');
  const body = {
    target,
    cookie: document.getElementById('inputCookie').value.trim(),
    cookie_b: document.getElementById('inputCookieB').value.trim(),
    scope_notes: document.getElementById('inputNotes').value.trim(),
  };
  const res = await fetch(API+'/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  hideNewModal();
  document.getElementById('inputTarget').value='';
  document.getElementById('inputCookie').value='';
  document.getElementById('inputCookieB').value='';
  document.getElementById('inputNotes').value='';
  await fetchSessions();
  selectSession(data.id);
}

async function deleteSession(sid) {
  if (!confirm('确认删除此会话？所有日志和发现将被清除。')) return;
  await fetch(API+`/api/sessions/${sid}`, {method:'DELETE'});
  if (currentSid === sid) {
    currentSid = null;
    if (ws) { ws.close(); ws=null; }
    document.getElementById('contentHeader').style.display='none';
    document.getElementById('inputBar').style.display='none';
    document.getElementById('logOutput').innerHTML='<div class="empty"><h3>选择或创建测试会话</h3></div>';
  }
  fetchSessions();
}

async function selectSession(sid) {
  currentSid = sid;
  if (ws) { ws.close(); ws=null; }
  document.getElementById('contentHeader').style.display='flex';
  document.getElementById('inputBar').style.display='flex';
  document.getElementById('logOutput').innerHTML='';
  document.getElementById('findingsList').innerHTML='';
  document.getElementById('findingsCount').textContent='0';
  updatePhaseBar('threat_model');
  fetchSessions();

  const session = await (await fetch(API+`/api/sessions/${sid}`)).json();
  updateSessionUI(session);

  const logs = await (await fetch(API+`/api/sessions/${sid}/logs`)).json();
  logs.forEach(l => appendLog(l.role, l.content));
  document.getElementById('logOutput').scrollTop = document.getElementById('logOutput').scrollHeight;

  const findings = await (await fetch(API+`/api/sessions/${sid}/findings`)).json();
  findings.forEach(addFindingCard);

  connectWS(sid);
}

function connectWS(sid) {
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/${sid}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'ping') return;
    switch(msg.type) {
      case 'stream': appendStream(msg.data.text); break;
      case 'phase': updatePhaseBar(msg.data.phase); refreshBlackboard(); break;
      case 'status': updateStatus(msg.data.status); break;
      case 'finding': addFindingCard(msg.data); refreshBlackboard(); break;
      case 'error': appendLog('system', 'Error: '+msg.data.message); break;
      case 'done': fetchSessions(); refreshBlackboard(); break;
    }
  };
  ws.onclose = () => { setTimeout(()=>{ if(currentSid===sid) connectWS(sid); }, 3000); };
}

let streamBuffer = null;
function appendStream(text) {
  const out = document.getElementById('logOutput');
  if (!streamBuffer) {
    streamBuffer = document.createElement('div');
    streamBuffer.className = 'msg assistant';
    out.appendChild(streamBuffer);
  }
  streamBuffer.textContent += text;
  out.scrollTop = out.scrollHeight;
}

function appendLog(role, content) {
  streamBuffer = null;
  const out = document.getElementById('logOutput');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  if (role==='user') div.textContent = '> '+content;
  else div.textContent = content;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function updatePhaseBar(phase) {
  const steps = document.querySelectorAll('.phase-step');
  const idx = PHASES.indexOf(phase);
  steps.forEach((s,i) => {
    s.classList.remove('active','done');
    if (i<idx) s.classList.add('done');
    else if (i===idx) s.classList.add('active');
  });
}

function updateStatus(status) {
  const el = document.getElementById('sessionStatus');
  el.innerHTML = `<span class="badge badge-${status}">${statusText(status)}</span>`;
  fetchSessions();
}

function updateSessionUI(session) {
  updateStatus(session.status);
  if (session.phase) updatePhaseBar(session.phase);
}

function addFindingCard(f) {
  const el = document.getElementById('findingsList');
  const cnt = document.getElementById('findingsCount');
  const card = document.createElement('div');
  card.className = 'finding-card';
  const sev = (f.severity||'').toLowerCase();
  const sevClass = sev.startsWith('p0')?'p0':sev.startsWith('p1')?'p1':'p2';
  card.innerHTML = `
    <div class="title"><span class="badge badge-${sevClass}">${esc(f.severity)}</span> ${esc(f.title)}</div>
    <div class="detail">${esc(f.vuln_type)} · ${esc(f.endpoint||'')}</div>
  `;
  el.prepend(card);
  cnt.textContent = el.children.length;
  document.getElementById('findingsPanel').classList.add('show');
}

function toggleFindings() {
  document.getElementById('findingsPanel').classList.toggle('show');
  document.getElementById('blackboardPanel').classList.remove('show');
}

function toggleBlackboard() {
  const panel = document.getElementById('blackboardPanel');
  panel.classList.toggle('show');
  document.getElementById('findingsPanel').classList.remove('show');
  if (panel.classList.contains('show') && currentSid) refreshBlackboard();
}

async function refreshBlackboard() {
  if (!currentSid) return;
  try {
    const summary = await (await fetch(API+`/api/sessions/${currentSid}/blackboard/summary`)).json();
    const labels = {attack_surfaces:'攻击面', verified_findings:'已验证', pending_hypotheses:'待验证', exploits:'利用原语', failure_records:'失败记录'};
    const colors = {attack_surfaces:'var(--accent)', verified_findings:'var(--green)', pending_hypotheses:'var(--orange)', exploits:'var(--purple)', failure_records:'var(--red)'};
    let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">';
    for (const [k,v] of Object.entries(summary)) {
      html += `<div style="background:var(--bg3);padding:6px 10px;border-radius:6px;border-left:3px solid ${colors[k]||'var(--border)'}"><div style="font-size:10px;color:var(--fg2)">${labels[k]||k}</div><div style="font-size:18px;font-weight:bold;color:${colors[k]}">${v}</div></div>`;
    }
    html += '</div>';
    document.getElementById('bbSummary').innerHTML = html;

    const entries = await (await fetch(API+`/api/sessions/${currentSid}/blackboard`)).json();
    let details = '';
    const grouped = {};
    for (const e of entries) { (grouped[e.partition] = grouped[e.partition] || []).push(e); }
    for (const [part, items] of Object.entries(grouped)) {
      details += `<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:bold;color:${colors[part]||'var(--fg2)'};margin-bottom:4px">${labels[part]||part} (${items.length})</div>`;
      for (const item of items.slice(0, 20)) {
        const statusIcon = item.status === 'done' ? '✓' : item.status === 'failed' ? '✗' : '•';
        details += `<div style="padding:3px 0;border-bottom:1px solid var(--border);font-size:11px;color:var(--fg2)"><span>${statusIcon}</span> <span style="color:var(--fg)">${item.key}</span>${item.value ? ' — '+item.value.substring(0,60) : ''}</div>`;
      }
      details += '</div>';
    }
    document.getElementById('bbDetails').innerHTML = details || '<div style="color:var(--fg2)">黑板为空</div>';
  } catch(e) { console.error('blackboard error', e); }
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if (!msg || !currentSid) return;
  input.value = '';
  appendLog('user', msg);
  streamBuffer = null;
  await fetch(API+`/api/sessions/${currentSid}/input`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:msg})
  });
}

function quickSend(msg) {
  if (!currentSid) return;
  appendLog('user', msg);
  streamBuffer = null;
  fetch(API+`/api/sessions/${currentSid}/input`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:msg})
  });
}

async function stopCurrent() {
  if (!currentSid) return;
  if (!confirm('确认停止当前测试？')) return;
  await fetch(API+`/api/sessions/${currentSid}/stop`, {method:'POST'});
  fetchSessions();
}

// --- Settings ---
async function showSettingsModal() {
  document.getElementById('settingsModal').classList.add('show');
  const res = await fetch(API+'/api/settings');
  const s = await res.json();
  document.getElementById('setProvider').value = s.provider || 'anthropic';
  document.getElementById('setModel').value = s.model || '';
  document.getElementById('setMaxTokens').value = s.max_tokens || 16384;
  document.getElementById('setApiKey').value = '';
  document.getElementById('setApiKeyHint').textContent = s.api_key_masked ? `当前: ${s.api_key_masked}` : '未设置';
  document.getElementById('setBaseUrl').value = s.base_url || '';
  document.getElementById('setBurpProxy').value = s.burp_proxy || 'http://127.0.0.1:8080';
  document.getElementById('setMaxConcurrent').value = s.max_concurrent || 3;
}
function hideSettingsModal() { document.getElementById('settingsModal').classList.remove('show'); }

async function saveSettings() {
  const body = {
    provider: document.getElementById('setProvider').value,
    model: document.getElementById('setModel').value.trim(),
    max_tokens: parseInt(document.getElementById('setMaxTokens').value) || 16384,
    base_url: document.getElementById('setBaseUrl').value.trim(),
    burp_proxy: document.getElementById('setBurpProxy').value.trim(),
    max_concurrent: parseInt(document.getElementById('setMaxConcurrent').value) || 3,
  };
  const apiKey = document.getElementById('setApiKey').value.trim();
  if (apiKey) body.api_key = apiKey;
  await fetch(API+'/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  hideSettingsModal();
}

// --- Skill Editor ---
async function showSkillModal() {
  document.getElementById('skillModal').classList.add('show');
  const res = await fetch(API+'/api/skill');
  const data = await res.json();
  document.getElementById('skillEditor').value = data.content || '';
  document.getElementById('skillPath').textContent = data.path || '';
}
function hideSkillModal() { document.getElementById('skillModal').classList.remove('show'); }

async function saveSkill() {
  const content = document.getElementById('skillEditor').value;
  if (!content.trim()) return alert('Skill内容不能为空');
  const res = await fetch(API+'/api/skill', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content})});
  if (res.ok) { hideSkillModal(); alert('Skill已保存'); }
  else alert('保存失败');
}

// --- Tab key in textarea ---
document.addEventListener('DOMContentLoaded', () => {
  const editor = document.getElementById('skillEditor');
  if (editor) editor.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s=editor.selectionStart,end=editor.selectionEnd; editor.value=editor.value.substring(0,s)+'  '+editor.value.substring(end); editor.selectionStart=editor.selectionEnd=s+2; }
  });
});

fetchSessions();
setInterval(fetchSessions, 10000);
</script>
